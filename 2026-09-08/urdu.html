    color: #fde68a;
    line-height: 2.2;

    color: #94a3b8;
    margin-top: 14px;

    font-weight: 800;

    height: 8px;

  .secondary-grid {

  .secondary-card {

    font-weight: 700;

  .card-source {

    font-weight: 600;
    color: #f59e0b;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding-top: 8px;

  .legal-disclaimer-title {

    font-size: 20px;

    font-weight: 800;
    margin-bottom: 14px;

    line-height: 1.6;

  .legal-disclaimer-text {
    font-size: 14px;
    line-height: 2.2;
    color: #cbd5e1;
    margin-bottom: 12px;

  }

  .legal-disclaimer-text b {

  }

  .advisory-gratis-pill {

    background: rgba(217, 119, 6, 0.15);

  .legal-contacts-row {

  .legal-contacts-row a:hover {

  /* Footer Navigation */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 0 0;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 13px;
    color: #64748b;
    line-height: 1.8;
  }

  .nav-btn {
    background: #0f1a36;
    border: 1px solid rgba(217, 119, 6, 0.3);

    padding: 10px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Noto Nastaliq Urdu', serif;
    line-height: 1.8;
  }

  .nav-btn:hover {
    background: #f59e0b;
    color: #050a14;
  }
</style>

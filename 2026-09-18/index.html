          Next Desk (0${activeDeskId === 6 ? 1 : activeDeskId + 1}) →
        </button>
      </div>
    </article>
  `;
}

// Initialize with URL parameter support
const urlParams = new URLSearchParams(window.location.search);
const initialDesk = parseInt(urlParams.get('desk') || '1', 10);
if (!isNaN(initialDesk) && initialDesk >= 1 && initialDesk <= 6) {
  activeDeskId = initialDesk;
}
renderDesk(activeDeskId);
</script>

</body>

function renderDesk(id) {

  }

  const stage = document.getElementById('deskStage');

  }

  let secondaryHtml = '';
  if (d.secondary_items && d.secondary_items.length > 0) {
    secondaryHtml = `

        <div class="secondary-grid">
          ${d.secondary_items.map(it => `
